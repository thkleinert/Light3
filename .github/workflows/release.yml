name: Build and attach release artifact

# Callable two ways:
#   - from release-please.yml, immediately after it publishes a release
#   - manually, to backfill a release whose artifact is missing
#
# Deliberately NOT triggered by `release: published`. Release Please publishes
# under the default GITHUB_TOKEN, and GitHub does not start workflow runs from
# GITHUB_TOKEN events, so that trigger never fired - which is why every release
# up to and including v1.2.2 shipped with no plugin zip attached.

on:
  workflow_call:
    inputs:
      tag:
        description: Tag of the release to build and attach the plugin zip to
        required: true
        type: string
  workflow_dispatch:
    inputs:
      tag:
        description: Tag of an existing release to backfill, e.g. v1.2.2
        required: true
        type: string

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-latest

    steps:
      - name: Verify a tag was supplied
        run: |
          if [ -z "${{ inputs.tag }}" ]; then
            echo "::error::No tag supplied. Refusing to build an unlabelled artifact."
            exit 1
          fi
          echo "Building artifact for ${{ inputs.tag }}"

      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag }}

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: signing-helper-go/go.mod

      - name: Build universal binary
        run: |
          cd signing-helper-go
          GOOS=darwin GOARCH=arm64 go build -ldflags="-s -w" -o dist/light3-sign-arm64 .
          GOOS=darwin GOARCH=amd64 go build -ldflags="-s -w" -o dist/light3-sign-x64 .
          lipo -create -output dist/light3-sign dist/light3-sign-arm64 dist/light3-sign-x64
          chmod +x dist/light3-sign

      - name: Bundle plugin
        run: |
          cp signing-helper-go/dist/light3-sign light3.lrplugin/light3-sign
          zip -r "light3-${{ inputs.tag }}.lrplugin.zip" light3.lrplugin

      # Keep the zip even if the upload fails, so a permissions or API problem
      # does not throw away a good build.
      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: light3-${{ inputs.tag }}.lrplugin
          path: light3-*.lrplugin.zip
          if-no-files-found: error

      # Uploaded with `gh` rather than softprops/action-gh-release, which
      # resolves the release from GITHUB_REF for the write even when tag_name
      # is supplied. GITHUB_REF is refs/heads/main for both workflow_dispatch
      # and a workflow_call from a push, so the write failed with "Resource
      # not accessible by integration" despite Contents: write being granted.
      - name: Upload release asset
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "${{ inputs.tag }}" light3-*.lrplugin.zip --clobber
